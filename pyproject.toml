[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farewise"
version = "0.1.0"
description = "Explainable flight fare prediction and booking advisor"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "pyyaml>=6", "joblib>=1.3", "pydantic>=2", "streamlit>=1.30", "plotly>=5", "pyarrow>=14", "lightgbm>=4", "shap>=0.45", "scipy>=1.11", "statsmodels>=0.14", "pandera>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pre-commit>=3"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E701", "E702"]
